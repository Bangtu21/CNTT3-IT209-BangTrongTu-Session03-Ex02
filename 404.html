<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Không tìm thấy trang</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: white;
            width: 90%;
            max-width: 600px;
            padding: 50px 30px;
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        .error-code {
            font-size: 100px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .button:hover {
            background-color: #555;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="error-code">404</div>

    <h1>Không tìm thấy trang</h1>

    <p>
        Xin lỗi, trang bạn đang tìm kiếm không tồn tại
        hoặc đã được di chuyển.
    </p>

    <a href="/" class="button">Quay về trang chủ</a>
</div>

</body>
</html>
